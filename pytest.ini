[pytest]
# Where the actual tests live. Keeps a bare `pytest` from walking the whole
# backend looking for them.
testpaths =
    backend/recon_engine/tests
    backend/excel_comparator/tests

# Only `test_*.py`, NOT pytest's default extra `*_test.py` pattern. The Test
# Connection feature's production modules are named for what they do —
# `backend/connections/live_test.py` exposes `test_connection()`, imported by
# routes/connections.py — and the `*_test.py` default made pytest try to
# collect that application function as a test case, failing on its keyword-only
# arguments ("fixture 'kind' not found"). Narrowing the pattern fixes the
# collection error without renaming production code and its callers.
python_files = test_*.py
